name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK and Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;33.0.1"

      - name: Build Debug APK
        run: |
          cd proj.android
          chmod +x gradlew || true
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" > local.properties
          ./gradlew assembleDebug --no-daemon --info | grep -E "ERROR|FAILED|Exception|Caused by" -B 2 -A 5
