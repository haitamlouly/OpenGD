name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

      - name: Build APK via Gradle
        run: |
          cd proj.android
          echo "ndk.dir=$ANDROID_HOME/ndk/25.2.9519653" > local.properties
          echo "AX_ROOT=$(pwd)/../Source/axmol" >> local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pandroid.useAndroidX=true | grep -E "ERROR|FAILED|Exception|Caused by|Could not" -B 2 -A 5

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenGD-debug-apk
          path: proj.android/app/build/outputs/apk/debug/*.apk
